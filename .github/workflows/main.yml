# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # Composer config validation
  composer:
    name: Composer config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Validate composer.json
        run: make validate

  # PHP syntax validation and dependency resolution
  php:
    name: PHP ${{ matrix.php }}${{ matrix.lowest && ' (lowest)' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
        lowest: [false]
        include:
          - php: '8.1'
            lowest: true
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: make install PHP_VERSION=${{ matrix.php }} ${{ matrix.lowest && 'DEPENDENCIES_LOWEST=1' || '' }}
      - name: Ensure no lockfile was left behind
        run: test ! -e composer.lock
      - name: Check PHP syntax
        run: make lint PHP_VERSION=${{ matrix.php }}

  # phpstan for several php versions
  phpstan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php_version: [8.1, 8.2, 8.3]
    steps:
      - uses: actions/checkout@v3
      - uses: php-actions/composer@v6
        with:
          php_version: ${{ matrix.php_version }}

      - name: PHPStan Static Analysis
        uses: php-actions/phpstan@v3
        with:
          php_version: ${{ matrix.php_version }}
          configuration: phpstan.neon
          path: Controller/ Model/ Test/ View/
